name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    # `claude/**` too: a stacked PR targets the branch below it, so a
    # master-only filter left every PR in a stack with no checks at all.
    branches: [ "master", "claude/**" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Backend Docker image
      run: docker build ./backend --file backend/Dockerfile --tag psychapp-backend:$(date +%s)
    - name: Build the Frontend Docker image
      run: docker build ./frontend --file frontend/Dockerfile --tag psychapp-frontend:$(date +%s)
